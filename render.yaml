services:
  - type: web
    name: options-agent-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    # The app's own state sync (github_state_sync.py) pushes to this same
    # repo/branch constantly (trade journal, ledger, scan results, etc.)
    # -- with autoDeploy left at Render's default (true) and no filter,
    # every one of those pushes was triggering a full redeploy, which in
    # turn re-runs state sync on boot, which pushes again: a self-
    # sustaining loop that produced 100+ redundant commits/deploys in
    # under an hour. autoDeploy was turned off entirely to stop that,
    # which also meant every real code fix needed a manual deploy click.
    # buildFilter fixes the actual problem instead of avoiding it: state
    # pushes (everything under config/, plus the trade journal's .xlsx
    # export at the repo root -- see order_execution.py's
    # push_binary_file call) never trigger a deploy, so autoDeploy can
    # safely stay on for genuine code changes. Deploys still bypass this
    # filter entirely if triggered manually from the dashboard.
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - config/**
        - "*.xlsx"
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: TIGER_ID
        sync: false
      - key: TIGER_ACCOUNT
        sync: false
      - key: TIGER_PRIVATE_KEY_PK1
        sync: false
      - key: TIGER_PRIVATE_KEY_PK8
        sync: false
      - key: TIGER_LICENSE
        sync: false
      - key: TIGER_ENV
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: DIVIDEND_PORTFOLIO_CAPITAL
        sync: false
