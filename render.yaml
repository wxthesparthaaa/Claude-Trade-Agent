services:
  - type: web
    name: options-agent-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: TIGER_ID
        sync: false
      - key: TIGER_ACCOUNT
        sync: false
      - key: TIGER_PRIVATE_KEY_PK1
        sync: false
      - key: TIGER_PRIVATE_KEY_PK8
        sync: false
      - key: TIGER_LICENSE
        sync: false
      - key: TIGER_ENV
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: DIVIDEND_PORTFOLIO_CAPITAL
        sync: false
