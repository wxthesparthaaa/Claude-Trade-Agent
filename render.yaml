services:
  - type: web
    name: options-agent-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    # The app's own state sync (github_state_sync.py) pushes to this same
    # repo/branch constantly (trade journal, ledger, scan results, etc.)
    # -- with autoDeploy left at Render's default (true), every one of
    # those pushes was triggering a full redeploy, which in turn re-runs
    # state sync on boot, which pushes again: a self-sustaining loop that
    # produced 100+ redundant commits/deploys in under an hour. Deploys
    # now only happen from an explicit manual deploy or a real code push
    # handled outside this auto-watch.
    autoDeploy: false
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: TIGER_ID
        sync: false
      - key: TIGER_ACCOUNT
        sync: false
      - key: TIGER_PRIVATE_KEY_PK1
        sync: false
      - key: TIGER_PRIVATE_KEY_PK8
        sync: false
      - key: TIGER_LICENSE
        sync: false
      - key: TIGER_ENV
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: DIVIDEND_PORTFOLIO_CAPITAL
        sync: false
