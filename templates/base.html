<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Claude Trading Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  {% set current_portfolio = request.args.get('portfolio') %}
  <header class="topbar">
    <span class="brand">Claude Trading Agent</span>
    <div class="topbar-right">
      <nav class="portfolio-switcher">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if current_portfolio is none and request.endpoint != 'news' else '' }}">Home</a>
        <a href="{{ url_for('dashboard', portfolio='growth') }}" class="{{ 'active' if current_portfolio == 'growth' and request.endpoint != 'news' else '' }}">Growth</a>
        <a href="{{ url_for('dashboard', portfolio='dividend') }}" class="{{ 'active' if current_portfolio == 'dividend' and request.endpoint != 'news' else '' }}">Dividend</a>
        <a href="{{ url_for('news', portfolio=current_portfolio or 'growth') }}" class="{{ 'active' if request.endpoint == 'news' else '' }}">News</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="market-status-footer">
    <div class="market-status-list">
      {% for line in market_status_lines %}
      <span class="market-status-item {{ 'market-open' if 'OPEN --' in line else 'market-closed' }}">{{ line }}</span>
      {% endfor %}
    </div>
    <p class="market-status-caveat">Regular trading hours shown -- market holidays aren't accounted for.</p>
  </footer>
</body>
</html>
